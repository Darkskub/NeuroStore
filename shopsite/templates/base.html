<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Магазин{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="/static/store/styles.css" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-flex">
      <a class="logo" href="/">NeuroShop</a>
      <nav class="nav">
        <a href="/">Главная</a>
        <a href="/cart/">Корзина ({{ cart_total_qty }}) — {{ cart_total_price }} ₽</a>
        <a href="/admin/">Админка</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container small">
      Учебный проект Django. Изображения и цены демонстрационные.
    </div>
  </footer>
</body>
</html>
