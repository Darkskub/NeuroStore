{% extends "base.html" %}
{% block title %}Вход{% endblock %}

{% block content %}
<h1>Вход</h1>

<form method="post" class="card" style="max-width:420px;padding:16px;">
  {% csrf_token %}
  <div style="display:flex;flex-direction:column;gap:10px;">
    <label>Логин
      <input type="text" name="username" required class="qty" style="width:100%;">
    </label>
    <label>Пароль
      <input type="password" name="password" required class="qty" style="width:100%;">
    </label>
    {% if form.errors %}
      <div class="alert success" style="background:#351212;border-color:#7a1f1f;">
        Неверный логин или пароль.
      </div>
    {% endif %}
    <button type="submit" class="btn">Войти</button>
  </div>
  <input type="hidden" name="next" value="{{ next }}">
</form>

<p class="small" style="margin-top:10px;">
  Нет аккаунта? <a href="{% url 'store:register' %}">Зарегистрироваться</a>
</p>
{% endblock %}
