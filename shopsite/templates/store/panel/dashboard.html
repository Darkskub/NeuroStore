{% extends "base.html" %}
{% block title %}Панель администратора{% endblock %}

{% block content %}
<h1 class="h3 mb-3">Панель администратора</h1>

<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
  <div class="col">
    <a class="card h-100 text-decoration-none" href="{% url 'store:panel_categories' %}">
      <div class="card-body">
        <h5 class="card-title mb-1">Категории</h5>
        <div class="text-body-secondary small">Добавить / изменить / удалить</div>
      </div>
    </a>
  </div>

  <div class="col">
    <a class="card h-100 text-decoration-none" href="{% url 'store:panel_products' %}">
      <div class="card-body">
        <h5 class="card-title mb-1">Товары</h5>
        <div class="text-body-secondary small">Добавить / изменить / удалить</div>
      </div>
    </a>
  </div>

  <div class="col">
    <a class="card h-100 text-decoration-none" href="{% url 'store:panel_news' %}">
      <div class="card-body">
        <h5 class="card-title mb-1">Новости</h5>
        <div class="text-body-secondary small">Публикации на главной</div>
      </div>
    </a>
  </div>

  <div class="col">
    <a class="card h-100 text-decoration-none" href="{% url 'store:panel_users' %}">
      <div class="card-body">
        <h5 class="card-title mb-1">Пользователи</h5>
        <div class="text-body-secondary small">Создать менеджера / удалить</div>
      </div>
    </a>
  </div>
</div>
{% endblock %}
