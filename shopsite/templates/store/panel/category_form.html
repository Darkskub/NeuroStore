{% extends "base.html" %}
{% block title %}Категория{% endblock %}
{% block content %}
<h1>{% if mode == "create" %}Добавить категорию{% else %}Изменить категорию{% endif %}</h1>

<form method="post" class="card" style="max-width:720px;padding:16px;">
  {% csrf_token %}
  <div style="display:flex;flex-direction:column;gap:12px;">
    <label>Название {{ form.name }}</label>
    <label>Слаг {{ form.slug }}</label>
    <label>Родитель {{ form.parent }}</label>
    <div style="display:flex;gap:10px;">
      <button class="btn" type="submit">Сохранить</button>
      <a class="btn btn-outline" href="{% url 'store:panel_categories' %}">Отмена</a>
    </div>
  </div>
</form>
{% endblock %}
