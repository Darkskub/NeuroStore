{% extends "base.html" %}
{% block title %}Категория{% endblock %}

{% block content %}
<h1 class="h3 mb-3">{% if mode == "create" %}Добавить категорию{% else %}Изменить категорию{% endif %}</h1>

<div class="card">
  <div class="card-body">
    <form method="post" class="row g-3" novalidate>
      {% csrf_token %}

      <div class="col-12">
        <label class="form-label">Название</label>
        {{ form.name }}
      </div>

      <div class="col-12">
        <label class="form-label">Родитель</label>
        {{ form.parent }}
      </div>

      <div class="col-12 d-flex gap-2">
        <button class="btn btn-primary" type="submit">Сохранить</button>
        <a class="btn btn-outline-secondary" href="{% url 'store:panel_categories' %}">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
