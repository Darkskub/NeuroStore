{% extends "base.html" %}
{% block title %}Создать менеджера{% endblock %}

{% block content %}
<h1 class="h3 mb-3">Создать менеджера</h1>

<div class="card">
  <div class="card-body">
    <form method="post" class="row g-3" novalidate>
      {% csrf_token %}

      <div class="col-12">
        <label class="form-label">Логин</label>
        {{ form.username }}
      </div>

      <div class="col-12">
        <label class="form-label">Пароль</label>
        {{ form.password1 }}
      </div>

      <div class="col-12">
        <label class="form-label">Повтор пароля</label>
        {{ form.password2 }}
      </div>

      <div class="col-12 d-flex gap-2">
        <button class="btn btn-primary" type="submit">Создать</button>
        <a class="btn btn-outline-secondary" href="{% url 'store:panel_users' %}">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
