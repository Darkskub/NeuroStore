{% extends "base.html" %}
{% block title %}Новость{% endblock %}

{% block content %}
<h1 class="h3 mb-3">{% if mode == "create" %}Добавить новость{% else %}Изменить новость{% endif %}</h1>

<div class="card">
  <div class="card-body">
    <form method="post" class="row g-3" novalidate>
      {% csrf_token %}

      <div class="col-12">
        <label class="form-label">Заголовок</label>
        {{ form.title }}
      </div>

      <div class="col-12">
        <label class="form-label">Текст</label>
        {{ form.body }}
      </div>

      <div class="col-12">
        <div class="form-check">
          {{ form.is_published }}
          <label class="form-check-label">Опубликовано</label>
        </div>
      </div>

      <div class="col-12 d-flex gap-2">
        <button class="btn btn-primary" type="submit">Сохранить</button>
        <a class="btn btn-outline-secondary" href="{% url 'store:panel_news' %}">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
