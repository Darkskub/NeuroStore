{% extends "base.html" %}
{% block title %}Новость{% endblock %}
{% block content %}
<h1>{% if mode == "create" %}Добавить новость{% else %}Изменить новость{% endif %}</h1>

<form method="post" class="card" style="max-width:900px;padding:16px;">
  {% csrf_token %}
  <div style="display:flex;flex-direction:column;gap:12px;">
    <label>Заголовок {{ form.title }}</label>
    <label>Слаг {{ form.slug }}</label>
    <label>Текст {{ form.body }}</label>
    <label style="display:flex;align-items:center;gap:10px;">
      {{ form.is_published }} Опубликовано
    </label>

    <div style="display:flex;gap:10px;">
      <button class="btn" type="submit">Сохранить</button>
      <a class="btn btn-outline" href="{% url 'store:panel_news' %}">Отмена</a>
    </div>
  </div>
</form>
{% endblock %}
