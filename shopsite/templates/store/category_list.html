{% extends "base.html" %}
{% block title %}Категории{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
  <h1 class="h3 mb-0">Категории</h1>
  <a class="btn btn-sm btn-outline-secondary" href="{% url 'store:product_list' %}">← В каталог</a>
</div>

<div class="row row-cols-1 row-cols-md-3 g-4">
  {% for c in categories %}
    <div class="col">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title mb-1">{{ c.name }}</h5>
          <div class="text-body-secondary small mb-3">Товаров: {{ c.products.count }}</div>
          <a class="btn btn-primary btn-sm" href="{% url 'store:category_detail' c.slug %}">Открыть</a>
        </div>
      </div>
    </div>
  {% empty %}
    <div class="col-12"><div class="alert alert-secondary">Категории пока не созданы.</div></div>
  {% endfor %}
</div>
{% endblock %}
