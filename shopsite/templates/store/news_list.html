{% extends "base.html" %}
{% block title %}Новости{% endblock %}
{% block content %}
<h1>Новости</h1>

{% if news %}
  {% for n in news %}
    <section class="card" style="padding:16px; margin-top:12px;">
      <h3 style="margin:0 0 6px;">{{ n.title }}</h3>
      <div class="muted small">{{ n.created_at|date:"d.m.Y H:i" }}</div>
      <p style="margin-top:10px;">{{ n.body }}</p>
    </section>
  {% endfor %}
{% else %}
  <p class="muted">Новостей пока нет.</p>
{% endif %}
{% endblock %}
