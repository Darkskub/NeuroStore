{% extends "base.html" %}
{% block title %}Мои заказы{% endblock %}
{% block content %}

<h1 class="h3 mb-3">Мои заказы</h1>

<div class="list-group">
  {% for o in orders %}
    <a class="list-group-item list-group-item-action" href="{% url 'store:my_order_detail' o.id %}">
      <div class="d-flex justify-content-between">
        <div>
          <div><strong>Заказ #{{ o.id }}</strong></div>
          <div class="text-muted small">{{ o.created_at }}</div>
        </div>
        <div class="text-end">
          <div class="badge bg-secondary">{{ o.get_status_display }}</div>
          <div class="small mt-1"><strong>{{ o.total_price }} ₽</strong></div>
        </div>
      </div>
    </a>
  {% empty %}
    <div class="alert alert-info">У вас пока нет заказов.</div>
  {% endfor %}
</div>

{% endblock %}
