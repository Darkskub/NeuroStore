<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% extends "base.html" %}
{% block title %}Добавить товар{% endblock %}

{% block content %}
<h1>Добавить товар</h1>

<form method="post" enctype="multipart/form-data" class="card" style="max-width:720px;padding:16px;">
  {% csrf_token %}
  <div style="display:flex;flex-direction:column;gap:12px;">
    {{ form.non_field_errors }}
    <label>Категория {{ form.category }}</label>
    <label>Название {{ form.name }}</label>
    <label>Слаг {{ form.slug }}</label>
    <label>Цена {{ form.price }}</label>
    <label>Изображение {{ form.image }}</label>
    <label>Описание {{ form.description }}</label>
    <div style="display:flex;gap:10px;">
      <button class="btn" type="submit">Сохранить</button>
      <a class="btn btn-outline" href="{% url 'store:category_list' %}">Отмена</a>
    </div>
  </div>
</form>
{% endblock %}
</title>
</head>
<body>

</body>
</html>
