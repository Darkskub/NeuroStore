{% extends "base.html" %}
{% block title %}Главная{% endblock %}
{% block content %}

<div class="d-flex align-items-center justify-content-between mb-3">
  <h1 class="h3 mb-0">Новости</h1>
  <a class="btn btn-outline-secondary btn-sm" href="{% url 'store:news_list' %}">Все новости</a>
</div>

<div class="row g-3">
  {% for n in news %}
    <div class="col-12 col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">{{ n.title }}</h5>
          <p class="text-muted small mb-2">{{ n.created_at }}</p>
          <a class="btn btn-sm btn-primary" href="{% url 'store:news_detail' n.slug %}">Читать</a>
        </div>
      </div>
    </div>
  {% empty %}
    <div class="col-12"><div class="alert alert-info">Новостей пока нет.</div></div>
  {% endfor %}
</div>

{% endblock %}
